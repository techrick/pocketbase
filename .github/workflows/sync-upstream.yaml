name: sync-upstream

on:
  schedule:
    - cron: '0 3 * * *'   # daily ~03:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max number of newest tags to check / backfill'
        default: '10'

permissions:
  contents: write          # push synced tags into the fork

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.find.outputs.tags }}
      newest: ${{ steps.find.outputs.newest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream tags & push new ones to fork
        run: |
          git remote add upstream https://github.com/pocketbase/pocketbase.git
          git fetch upstream 'refs/tags/v*:refs/tags/v*' --no-tags || true
          git push origin --tags || true

      - name: Determine tags without an image
        id: find
        env:
          LIMIT: ${{ github.event.inputs.limit || '10' }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          NEWEST="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          echo "newest=${NEWEST}" >> "$GITHUB_OUTPUT"
          MISSING=()
          for TAG in $(git tag -l 'v*' --sort=-v:refname | head -n "$LIMIT"); do
            if ! docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
              MISSING+=("$TAG")
            fi
          done
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo 'tags=[]' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${MISSING[@]}" | jq -R . | jq -cs . | sed 's/^/tags=/' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    if: ${{ needs.detect.outputs.tags != '[]' && needs.detect.outputs.tags != '' }}
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.detect.outputs.tags) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yaml
    with:
      tag: ${{ matrix.tag }}
      latest: ${{ matrix.tag == needs.detect.outputs.newest }}
    secrets: inherit
